<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treningskonkurranse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #18181f;
    --border: rgba(255,255,255,.07);
    --text: #f0f0f5;
    --muted: rgba(240,240,245,.45);
    --accent: #4f9eff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(79,158,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,158,255,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  /* HEADER */
  header { padding: 28px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
  .header-inner { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -.5px; text-transform: uppercase; }
  .brand-vs { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .15em; color: var(--muted); text-transform: uppercase; }
  .header-date { font-size: 12px; color: var(--muted); letter-spacing: .05em; }

  /* HERO SCORES */
  .hero {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    margin-bottom: 32px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .hero-player {
    flex: 1;
    min-width: 140px;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-right: 1px solid var(--border);
  }
  .hero-player:last-child { border-right: none; }
  .hero-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .15em;
    text-transform: uppercase;
  }
  .hero-score {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 48px;
    line-height: 1;
    letter-spacing: -2px;
  }
  .hero-sub { font-size: 12px; color: var(--muted); }
  .hero-lead-tag {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    width: fit-content;
  }

  /* ALGO BAR */
  .algo-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 32px; padding: 14px 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; align-items: center; }
  .algo-label { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-right: 4px; }
  .algo-pill { padding: 3px 10px; border-radius: 20px; background: var(--bg3); border: 1px solid var(--border); font-size: 11px; color: var(--text); white-space: nowrap; }
  .algo-pill b { color: var(--accent); font-weight: 500; }

  /* TABS */
  .tabs { display: flex; gap: 2px; margin-bottom: 24px; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 4px; width: fit-content; }
  .tab-btn {
    padding: 7px 18px; border: none; border-radius: 7px; background: transparent;
    color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-weight: 600;
    font-size: 14px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: all .2s;
  }
  .tab-btn.active { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }

  /* GRID */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .grid-full { margin-bottom: 20px; }

  /* CHART CARD */
  .chart-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px 18px; }
  .chart-card-title {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px;
    letter-spacing: .15em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .legend { display: flex; gap: 14px; font-size: 11px; flex-wrap: wrap; }
  .leg { display: flex; align-items: center; gap: 5px; color: var(--muted); }
  .leg-sq { width: 8px; height: 8px; border-radius: 2px; }
  .cw { position: relative; width: 100%; height: 220px; }
  .cw-tall { position: relative; width: 100%; height: 280px; }

  /* ACTIVITY SELECTOR */
  .act-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .act-pill {
    padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 12px; cursor: pointer;
    transition: all .15s; font-family: 'Barlow', sans-serif;
  }
  .act-pill:hover { border-color: rgba(255,255,255,.2); color: var(--text); }
  .act-pill.on { border-color: var(--accent); color: var(--accent); background: rgba(79,158,255,.08); }

  /* WEEK STATS */
  .week-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .week-row:last-child { border-bottom: none; }
  .week-label { width: 70px; color: var(--muted); font-size: 12px; flex-shrink: 0; }
  .week-bar-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .week-bar-row { display: flex; align-items: center; gap: 8px; }
  .week-bar-bg { flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .week-bar-fill { height: 100%; border-radius: 3px; transition: width .4s ease; }
  .week-bar-val { font-size: 11px; min-width: 30px; text-align: right; }

  /* LOG FORM */
  .form-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 20px; }
  .form-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 20px; color: var(--text); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .form-full { grid-column: 1 / -1; }
  .fg { display: flex; flex-direction: column; gap: 5px; }
  .fg label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .fg input, .fg select {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'Barlow', sans-serif; font-size: 14px;
    padding: 9px 12px; transition: border-color .15s; outline: none; -webkit-appearance: none;
  }
  .fg input:focus, .fg select:focus { border-color: var(--accent); }
  .fg select option { background: var(--bg3); }
  .form-preview { text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: var(--accent); min-height: 28px; margin-bottom: 12px; letter-spacing: .05em; }
  .submit-btn {
    width: 100%; padding: 13px; color: #fff; border: none; border-radius: 10px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .submit-btn:hover { opacity: .88; }
  .submit-btn:active { transform: scale(.98); }

  /* RECENT LOG */
  .log-entry { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; animation: fadein .3s ease; }
  @keyframes fadein { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }
  .log-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .log-name { flex: 1; font-weight: 400; }
  .log-player-name { font-size: 11px; color: var(--muted); margin-right: 4px; }
  .log-date { color: var(--muted); font-size: 11px; }
  .log-pts { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; }
  .log-del {
    width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all .15s; font-family: 'Barlow', sans-serif;
  }
  .log-del:hover { border-color: #f44; color: #f44; background: rgba(255,68,68,.08); }

  /* PLAYER MANAGEMENT */
  .player-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 20px; }
  .player-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .player-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bg3); border-radius: 8px; border: 1px solid var(--border); }
  .player-color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .player-row-name { flex: 1; font-size: 14px; }
  .player-row-score { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; margin-right: 8px; }
  .player-del-btn {
    width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s; font-family: 'Barlow', sans-serif;
  }
  .player-del-btn:hover { border-color: #f44; color: #f44; background: rgba(255,68,68,.08); }
  .add-player-row { display: flex; gap: 8px; }
  .add-player-row input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'Barlow', sans-serif; font-size: 14px;
    padding: 9px 12px; outline: none;
  }
  .add-player-row input:focus { border-color: var(--accent); }
  .add-player-btn {
    padding: 9px 18px; border-radius: 8px; border: none;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px;
    letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
    background: var(--accent); color: #fff; transition: opacity .15s;
  }
  .add-player-btn:hover { opacity: .85; }

  /* TABS CONTENT */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .grid-2 { grid-template-columns: 1fr; }
    .hero-score { font-size: 34px; }
    .hero-player { padding: 16px 14px; min-width: 100px; }
    .form-grid { grid-template-columns: 1fr; }
    .tabs { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-title">Treningskonkurranse</div>
        <div class="brand-vs" id="brandVs"></div>
      </div>
      <div class="header-date" id="hdate"></div>
    </div>
  </header>

  <!-- HERO (dynamic) -->
  <div class="hero" id="heroSection"></div>

  <!-- ALGO -->
  <div class="algo-bar">
    <span class="algo-label">Poeng:</span>
    <span class="algo-pill">Løping <b>10p/km</b></span>
    <span class="algo-pill">Svømming <b>20p/km</b></span>
    <span class="algo-pill">Sykling <b>3p/km</b></span>
    <span class="algo-pill">Pullups <b>1.5p</b></span>
    <span class="algo-pill">Pushups <b>0.5p</b></span>
    <span class="algo-pill">Situps <b>0.3p</b></span>
    <span class="algo-pill">Vekttrening <b>0.8p/min</b></span>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="goTab('oversikt',this)">Oversikt</button>
    <button class="tab-btn" onclick="goTab('aktivitet',this)">Aktivitet</button>
    <button class="tab-btn" onclick="goTab('uke',this)">Uke</button>
    <button class="tab-btn" onclick="goTab('logg',this)">+ Logg økt</button>
    <button class="tab-btn" onclick="goTab('deltakere',this)">Deltakere</button>
  </div>

  <!-- TAB: OVERSIKT -->
  <div class="tab-content active" id="t-oversikt">
    <div class="grid-full chart-card">
      <div class="chart-card-title">
        <span>Kumulativ totalscore — dag for dag</span>
        <div class="legend" id="legendCumul"></div>
      </div>
      <div class="cw-tall"><canvas id="cumulChart"></canvas></div>
    </div>
    <div class="grid-full chart-card" style="margin-top:20px">
      <div class="chart-card-title">
        <span>Daglig poeng</span>
        <div class="legend" id="legendDaily"></div>
      </div>
      <div class="cw-tall"><canvas id="dailyChart"></canvas></div>
    </div>
  </div>

  <!-- TAB: AKTIVITET -->
  <div class="tab-content" id="t-aktivitet">
    <div class="grid-full chart-card">
      <div class="chart-card-title">Velg aktivitet</div>
      <div class="act-pills" id="actPills"></div>
      <div class="legend" id="legendAct" style="margin-bottom:14px"></div>
      <div class="cw-tall"><canvas id="actChart"></canvas></div>
    </div>
  </div>

  <!-- TAB: UKE -->
  <div class="tab-content" id="t-uke">
    <div class="grid-2">
      <div class="chart-card">
        <div class="chart-card-title">Ukentlig poeng</div>
        <div class="cw"><canvas id="weekChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">Uke-for-uke fordel</div>
        <div id="weekRows"></div>
      </div>
    </div>
  </div>

  <!-- TAB: LOGG -->
  <div class="tab-content" id="t-logg">
    <div class="form-card">
      <div class="form-title">Logg ny økt</div>
      <div class="form-grid">
        <div class="fg form-full">
          <label>Person</label>
          <select id="fp"></select>
        </div>
        <div class="fg form-full">
          <label>Dato</label>
          <input type="date" id="fd">
        </div>
        <div class="fg"><label>Løping (km)</label><input type="number" id="fr" placeholder="0" min="0" step="0.1"></div>
        <div class="fg"><label>Sykling (km)</label><input type="number" id="fb" placeholder="0" min="0" step="0.1"></div>
        <div class="fg"><label>Svømming (km)</label><input type="number" id="fs" placeholder="0" min="0" step="0.1"></div>
        <div class="fg"><label>Pushups</label><input type="number" id="fpu" placeholder="0" min="0"></div>
        <div class="fg"><label>Pullups</label><input type="number" id="fpl" placeholder="0" min="0"></div>
        <div class="fg"><label>Situps</label><input type="number" id="fsi" placeholder="0" min="0"></div>
        <div class="fg form-full"><label>Vekttrening (min)</label><input type="number" id="fv" placeholder="0" min="0"></div>
      </div>
      <div class="form-preview" id="fpreview"></div>
      <button class="submit-btn" style="background:var(--accent)" onclick="addEntry()">Legg til økt</button>
    </div>
    <div class="chart-card">
      <div class="chart-card-title">Siste økter</div>
      <div id="recentLog"></div>
    </div>
  </div>

  <!-- TAB: DELTAKERE -->
  <div class="tab-content" id="t-deltakere">
    <div class="player-card">
      <div class="form-title">Deltakere</div>
      <div class="player-list" id="playerList"></div>
      <div class="add-player-row">
        <input type="text" id="newPlayerName" placeholder="Navn på ny deltaker...">
        <button class="add-player-btn" onclick="addPlayer()">Legg til</button>
      </div>
    </div>
  </div>

</div>

<script>
const W = {run:10, bike:3, swim:20, push:.5, pull:1.5, sit:.3, weight:.8};
function pts(e) {
  return (e.run||0)*W.run + (e.bike||0)*W.bike + (e.swim||0)*W.swim +
    (e.push||0)*W.push + (e.pull||0)*W.pull + (e.sit||0)*W.sit + (e.weight||0)*W.weight;
}

// --- COLOR PALETTE ---
const PALETTE = [
  {color:'#4f9eff', bg:'rgba(79,158,255,.08)', dim:'rgba(79,158,255,.15)'},
  {color:'#ff6b35', bg:'rgba(255,107,53,.08)', dim:'rgba(255,107,53,.15)'},
  {color:'#2AE4BF', bg:'rgba(42,228,191,.08)', dim:'rgba(42,228,191,.15)'},
  {color:'#FECA57', bg:'rgba(254,202,87,.08)', dim:'rgba(254,202,87,.15)'},
  {color:'#a855f7', bg:'rgba(168,85,247,.08)', dim:'rgba(168,85,247,.15)'},
  {color:'#f472b6', bg:'rgba(244,114,182,.08)', dim:'rgba(244,114,182,.15)'},
  {color:'#34d399', bg:'rgba(52,211,153,.08)', dim:'rgba(52,211,153,.15)'},
  {color:'#fb923c', bg:'rgba(251,146,60,.08)', dim:'rgba(251,146,60,.15)'},
];
function pal(i) { return PALETTE[i % PALETTE.length]; }

// --- PLAYERS ---
const DEFAULT_PLAYERS = [
  {id: 'p1', name: 'Deg'},
  {id: 'p2', name: 'Sølve'},
];

function loadPlayers() {
  try {
    const saved = localStorage.getItem('treningsplayers');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return [...DEFAULT_PLAYERS];
}
function savePlayers(p) { localStorage.setItem('treningsplayers', JSON.stringify(p)); }
let players = loadPlayers();

function getPlayerName(id) { return (players.find(p=>p.id===id)||{}).name || id; }
function getPlayerIndex(id) { return players.findIndex(p=>p.id===id); }

const BASE_DATA = [

function loadDeleted() {
  try { return JSON.parse(localStorage.getItem('treningsdeleted') || '[]'); } catch(e) { return []; }
}
function saveDeleted(d) { localStorage.setItem('treningsdeleted', JSON.stringify(d)); }

function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem('treningsdata') || '[]');
    const deleted = loadDeleted();
    return [...BASE_DATA, ...saved].filter(e => !deleted.includes(e.id)).sort((a,b) => a.date.localeCompare(b.date));
  } catch(e) { return [...BASE_DATA]; }
}
function saveExtra(entry) {
  try {
    const saved = JSON.parse(localStorage.getItem('treningsdata') || '[]');
    saved.push(entry);
    localStorage.setItem('treningsdata', JSON.stringify(saved));
  } catch(e) {}
}
function deleteEntry(id) {
  // If it's a base entry, mark as deleted; if user-added, remove from storage
  const saved = JSON.parse(localStorage.getItem('treningsdata') || '[]');
  const idx = saved.findIndex(e => e.id === id);
  if (idx >= 0) {
    saved.splice(idx, 1);
    localStorage.setItem('treningsdata', JSON.stringify(saved));
  } else {
    const deleted = loadDeleted();
    deleted.push(id);
    saveDeleted(deleted);
  }
  data = loadData();
  renderAll();
}

let data = loadData();
const charts = {};
let idCounter = Date.now();

function getDateRange() {
  if (data.length === 0) return [];
  const dates = data.map(d => d.date).sort();
  const start = new Date(dates[0]), end = new Date(dates[dates.length-1]);
  const days = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1))
    days.push(d.toISOString().slice(0,10));
  return days;
}

function fmtDate(s) {
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('nb-NO', {day:'2-digit', month:'short'});
}

function getWeek(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 'Uke ' + (1 + Math.round(((d - w1) / 86400000 - 3 + (w1.getDay() + 6) % 7) / 7));
}

const GC = 'rgba(255,255,255,.05)';
const TC = 'rgba(255,255,255,.35)';

function mkChart(id, cfg) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), cfg);
}

const baseOpts = {
  responsive: true,
  maintainAspectRatio: false,
  interaction: { mode: 'index', intersect: false },
  plugins: {
    legend: { display: false },
    tooltip: {
      backgroundColor: 'rgba(10,10,15,.95)',
      borderColor: 'rgba(255,255,255,.1)',
      borderWidth: 1,
      titleColor: 'rgba(255,255,255,.7)',
      bodyColor: '#fff',
      padding: 10,
    }
  },
  scales: {
    x: { grid: { color: GC }, ticks: { color: TC, font: { size: 10, family: 'Barlow Condensed' }, maxRotation: 45, autoSkip: false } },
    y: { grid: { color: GC }, ticks: { color: TC, font: { size: 10 } }, beginAtZero: true }
  }
};

function deepMerge(a, b) {
  const r = {...a};
  for (const k in b) {
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) r[k] = deepMerge(a[k]||{}, b[k]);
    else r[k] = b[k];
  }
  return r;
}

function buildLegend(containerId) {
  const el = document.getElementById(containerId);
  el.innerHTML = players.map((p, i) =>
    `<span class="leg"><span class="leg-sq" style="background:${pal(i).color}"></span>${p.name}</span>`
  ).join('');
}

function buildDatasets(dataPerPlayer, type) {
  return players.map((p, i) => ({
    label: p.name,
    data: dataPerPlayer[p.id] || [],
    borderColor: pal(i).color,
    backgroundColor: pal(i).bg,
    borderWidth: type === 'daily' ? 2 : 2.5,
    pointRadius: type === 'act' ? 5 : type === 'daily' ? 4 : 3,
    pointHoverRadius: type === 'act' ? 8 : type === 'daily' ? 7 : 6,
    pointBackgroundColor: pal(i).color,
    tension: .3,
    fill: true,
    ...(type === 'act' ? {spanGaps: false} : {}),
  }));
}

// HEADER
function updateBrandVs() {
  document.getElementById('brandVs').textContent = players.map(p=>p.name).join(' vs ');
}

// HERO
function updateHero() {
  const totals = players.map(p => ({
    ...p,
    total: Math.round(data.filter(e=>e.p===p.id).reduce((a,e)=>a+pts(e),0))
  }));
  const maxTotal = Math.max(...totals.map(t=>t.total));
  const section = document.getElementById('heroSection');
  section.innerHTML = totals.map((t, i) => {
    const c = pal(i).color;
    const isLeader = t.total === maxTotal && totals.filter(x=>x.total===maxTotal).length === 1;
    return `<div class="hero-player">
      <div class="hero-name" style="color:${c}">${t.name}</div>
      <div class="hero-score" style="color:${c}">${t.total.toLocaleString('nb-NO')}</div>
      <div class="hero-sub">totalpoeng</div>
      ${isLeader ? `<div class="hero-lead-tag" style="background:${pal(i).dim};color:${c};border:1px solid ${c}40">Leder</div>` : ''}
    </div>`;
  }).join('');
}

// CUMULATIVE CHART
function renderCumul() {
  const days = getDateRange();
  if (days.length === 0) return;
  const lbls = days.map(fmtDate);
  const perPlayer = {};
  players.forEach(p => {
    let cumul = 0;
    perPlayer[p.id] = days.map(day => {
      data.filter(e=>e.date===day&&e.p===p.id).forEach(e=>cumul+=pts(e));
      return Math.round(cumul);
    });
  });
  buildLegend('legendCumul');
  mkChart('cumulChart', {
    type: 'line',
    data: { labels: lbls, datasets: buildDatasets(perPlayer, 'cumul') },
    options: deepMerge(baseOpts, {plugins:{tooltip:{callbacks:{label:c=>`  ${c.dataset.label}: ${c.parsed.y} poeng`}}}})
  });
}

// DAILY CHART
function renderDaily() {
  const days = getDateRange();
  if (days.length === 0) return;
  const lbls = days.map(fmtDate);
  const perPlayer = {};
  players.forEach(p => {
    perPlayer[p.id] = days.map(d => Math.round(data.filter(e=>e.date===d&&e.p===p.id).reduce((a,e)=>a+pts(e),0)));
  });
  buildLegend('legendDaily');
  mkChart('dailyChart', {
    type: 'line',
    data: { labels: lbls, datasets: buildDatasets(perPlayer, 'daily') },
    options: deepMerge(baseOpts, {plugins:{tooltip:{callbacks:{label:c=>c.parsed.y>0?`  ${c.dataset.label}: ${c.parsed.y} p`:null}}}})
  });
}

// ACTIVITY
const ACT_DEFS = [
  {key:'run', label:'Løping', unit:'km'},
  {key:'bike', label:'Sykling', unit:'km'},
  {key:'swim', label:'Svømming', unit:'km'},
  {key:'push', label:'Pushups', unit:'rep'},
  {key:'pull', label:'Pullups', unit:'rep'},
  {key:'sit', label:'Situps', unit:'rep'},
  {key:'weight', label:'Vekttrening', unit:'min'},
];
let currentAct = 'run';

function renderActPills() {
  const c = document.getElementById('actPills');
  c.innerHTML = '';
  ACT_DEFS.forEach(a => {
    const el = document.createElement('button');
    el.className = 'act-pill' + (a.key===currentAct?' on':'');
    el.textContent = a.label;
    el.onclick = () => { currentAct=a.key; renderActPills(); renderActChart(); };
    c.appendChild(el);
  });
}

function renderActChart() {
  const days = getDateRange();
  if (days.length === 0) return;
  const lbls = days.map(fmtDate);
  const def = ACT_DEFS.find(a=>a.key===currentAct);
  const perPlayer = {};
  players.forEach(p => {
    perPlayer[p.id] = days.map(d => {
      const v = data.filter(e=>e.date===d&&e.p===p.id).reduce((a,e)=>a+(e[def.key]||0),0);
      return v || null;
    });
  });
  buildLegend('legendAct');
  mkChart('actChart', {
    type: 'line',
    data: { labels: lbls, datasets: buildDatasets(perPlayer, 'act') },
    options: deepMerge(baseOpts, {plugins:{tooltip:{callbacks:{label:c=>c.parsed.y===null?null:`  ${c.dataset.label}: ${c.parsed.y} ${def.unit}`}}}})
  });
}

// WEEKLY
function renderWeek() {
  const weeks = {};
  data.forEach(e => {
    const w = getWeek(e.date);
    if (!weeks[w]) { weeks[w] = {}; players.forEach(p => weeks[w][p.id] = 0); }
    if (!weeks[w][e.p]) weeks[w][e.p] = 0;
    weeks[w][e.p] += pts(e);
  });
  const wlbls = Object.keys(weeks).sort();

  const perPlayer = {};
  players.forEach(p => {
    perPlayer[p.id] = wlbls.map(w => Math.round(weeks[w][p.id] || 0));
  });
  mkChart('weekChart', {
    type: 'line',
    data: { labels: wlbls, datasets: buildDatasets(perPlayer, 'week') },
    options: deepMerge(baseOpts, {scales:{x:{ticks:{autoSkip:false,maxRotation:0}}}})
  });

  const wrap = document.getElementById('weekRows');
  wrap.innerHTML = '';
  const allVals = wlbls.flatMap(w => players.map(p => weeks[w][p.id] || 0));
  const maxVal = Math.max(...allVals, 1);
  wlbls.forEach(w => {
    const row = document.createElement('div');
    row.className = 'week-row';
    const bars = players.map((p, i) => {
      const v = Math.round(weeks[w][p.id] || 0);
      return `<div class="week-bar-row">
        <div class="week-bar-bg"><div class="week-bar-fill" style="width:${v/maxVal*100}%;background:${pal(i).color}"></div></div>
        <div class="week-bar-val" style="color:${pal(i).color}">${v}p</div>
      </div>`;
    }).join('');
    row.innerHTML = `<div class="week-label">${w}</div><div class="week-bar-wrap">${bars}</div>`;
    wrap.appendChild(row);
  });
}

// RECENT LOG
function renderRecent() {
  const wrap = document.getElementById('recentLog');
  const sorted = [...data].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
  wrap.innerHTML = sorted.map(e => {
    const p = Math.round(pts(e));
    const pi = getPlayerIndex(e.p);
    const c = pal(pi >= 0 ? pi : 0).color;
    return `<div class="log-entry">
      <div class="log-dot" style="background:${c}"></div>
      <span class="log-player-name" style="color:${c}">${getPlayerName(e.p)}</span>
      <div class="log-name">${e.name||'Økt'}</div>
      <div class="log-date">${fmtDate(e.date)}</div>
      <div class="log-pts" style="color:${c}">${p}p</div>
      <button class="log-del" onclick="deleteEntry('${e.id}')" title="Slett">✕</button>
    </div>`;
  }).join('');
}

// PLAYER SELECT IN FORM
function renderPlayerSelect() {
  const sel = document.getElementById('fp');
  sel.innerHTML = players.map((p, i) =>
    `<option value="${p.id}">${p.name}</option>`
  ).join('');
}

// PLAYER LIST (Deltakere tab)
function renderPlayerList() {
  const list = document.getElementById('playerList');
  list.innerHTML = players.map((p, i) => {
    const total = Math.round(data.filter(e=>e.p===p.id).reduce((a,e)=>a+pts(e),0));
    return `<div class="player-row">
      <div class="player-color-dot" style="background:${pal(i).color}"></div>
      <div class="player-row-name">${p.name}</div>
      <div class="player-row-score" style="color:${pal(i).color}">${total}p</div>
      ${players.length > 2 ? `<button class="player-del-btn" onclick="removePlayer('${p.id}')" title="Fjern deltaker">✕</button>` : ''}
    </div>`;
  }).join('');
}

// ADD PLAYER
window.addPlayer = function() {
  const input = document.getElementById('newPlayerName');
  const name = input.value.trim();
  if (!name) return;
  const id = 'p' + (Date.now().toString(36));
  players.push({id, name});
  savePlayers(players);
  input.value = '';
  renderPlayerList();
  renderPlayerSelect();
  updateBrandVs();
  renderAll();
};

// REMOVE PLAYER
window.removePlayer = function(id) {
  if (players.length <= 2) return;
  players = players.filter(p => p.id !== id);
  savePlayers(players);
  // Remove entries for this player
  const saved = JSON.parse(localStorage.getItem('treningsdata') || '[]');
  localStorage.setItem('treningsdata', JSON.stringify(saved.filter(e => e.p !== id)));
  // Mark base entries as deleted
  const deleted = loadDeleted();
  BASE_DATA.filter(e => e.p === id).forEach(e => deleted.push(e.id));
  saveDeleted(deleted);
  data = loadData();
  renderPlayerList();
  renderPlayerSelect();
  updateBrandVs();
  renderAll();
};

// ADD ENTRY
window.addEntry = function() {
  const date = document.getElementById('fd').value;
  if (!date) { alert('Velg en dato'); return; }
  const playerId = document.getElementById('fp').value;
  const entry = {
    id: 'u' + (++idCounter).toString(36),
    p: playerId,
    date,
    name: getPlayerName(playerId) + ' økt',
    run: +document.getElementById('fr').value||0,
    bike: +document.getElementById('fb').value||0,
    swim: +document.getElementById('fs').value||0,
    push: +document.getElementById('fpu').value||0,
    pull: +document.getElementById('fpl').value||0,
    sit: +document.getElementById('fsi').value||0,
    weight: +document.getElementById('fv').value||0,
  };
  saveExtra(entry);
  data = loadData();
  renderAll();
  ['fr','fb','fs','fpu','fpl','fsi','fv'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fpreview').textContent = '';
  goTab('oversikt', document.querySelector('.tab-btn'));
};

window.deleteEntry = deleteEntry;

// PREVIEW
['fr','fb','fs','fpu','fpl','fsi','fv'].forEach(id => {
  document.getElementById(id)?.addEventListener('input', () => {
    const p = pts({
      run:+document.getElementById('fr').value||0,
      bike:+document.getElementById('fb').value||0,
      swim:+document.getElementById('fs').value||0,
      push:+document.getElementById('fpu').value||0,
      pull:+document.getElementById('fpl').value||0,
      sit:+document.getElementById('fsi').value||0,
      weight:+document.getElementById('fv').value||0,
    });
    document.getElementById('fpreview').textContent = p>0 ? `${Math.round(p)} poeng` : '';
  });
});

// TABS
window.goTab = function(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('t-'+id).classList.add('active');
  btn.classList.add('active');
  if (id==='aktivitet') { renderActPills(); renderActChart(); }
  if (id==='uke') renderWeek();
  if (id==='deltakere') renderPlayerList();
};

function renderAll() {
  updateHero();
  renderCumul();
  renderDaily();
  renderRecent();
  if (document.getElementById('t-aktivitet').classList.contains('active')) { renderActPills(); renderActChart(); }
  if (document.getElementById('t-uke').classList.contains('active')) renderWeek();
  if (document.getElementById('t-deltakere').classList.contains('active')) renderPlayerList();
}

// INIT
document.getElementById('fd').value = new Date().toISOString().slice(0,10);
document.getElementById('hdate').textContent = new Date().toLocaleDateString('nb-NO', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
updateBrandVs();
renderPlayerSelect();
renderActPills();
renderAll();
</script>
